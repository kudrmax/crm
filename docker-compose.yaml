services:
  db:
    image: postgres:14.1-alpine
    container_name: "db"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    env_file:
      - .env
    ports:
      - "5533:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  bot:
    container_name: "bot"
    build:
      context: .
      dockerfile: Dockerfile
    command: python3 bot.py
    volumes:
      - .:/bot
    env_file:
      - .env
  backup:
    container_name: "crm_backup"
    image: postgres:14.1-alpine
#    depends_on:
#      - db
    volumes:
      - ./backups:/backups
    command: >
      bash -c "while true; do
        PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h db -U $$POSTGRES_USER -Fc $$POSTGRES_DB > /backups/$$(date +%Y-%m-%d-%H-%M-%S).dump
        echo ""Backup done at $$(date +%Y-%m-%d_%H:%M:%S)""
        ls -1 /backups/*.dump | head -n -$$MAX_BACKUP_COUNT | xargs rm -f
        sleep $$BACKUP_DELTA
      done"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - BACKUP_DELTA=3600
      - MAX_BACKUP_COUNT=5
  load_to_yandex:
    container_name: "load_to_yandex"
    build:
      context: .
      dockerfile: Dockerfile.backup
    volumes:
      - ./src/backup_to_yandex_disk:/yandex_disk/backup_to_yandex_disk
      - ./src:/src
      - ./backups:/backups
    restart: unless-stopped
    command: >
      sh -c "while true; do
        python3 /yandex_disk/backup_to_yandex_disk/yandex_disk_backup.py
        sleep 3600
      done"
    env_file:
      - .env

volumes:
  pgdata: